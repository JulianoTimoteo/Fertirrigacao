<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento Operacional - Usina Pitangueiras v8.0</title>

    <!-- CSS Externos -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- CSS Customizados -->
    <!-- Core -->
    <link rel="stylesheet" href="css/style_global.css">
    <link rel="stylesheet" href="css/tratos.css">

    <!-- Dashboard -->
    <link rel="stylesheet" href="css/dashboard/dashboard-Status.css">
    <link rel="stylesheet" href="css/dashboard/perfil.css">
    <link rel="stylesheet" href="css/dashboard/ultimasleituras.css">

    <!-- Fertirrigação -->
    <link rel="stylesheet" href="css/fertirrigacao/cards.css">
    <link rel="stylesheet" href="css/fertirrigacao/analisetemporeal.css">
    <link rel="stylesheet" href="css/fertirrigacao/vazaolagoa.css">
    <link rel="stylesheet" href="css/fertirrigacao/volume.css">
    <link rel="stylesheet" href="css/fertirrigacao/metaaplic.css">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .chart-container { position: relative; width: 100%; height: 450px; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Telas do Sistema -->
    <div id="login-screen" class="min-h-screen items-center justify-center bg-gray-100 active p-4"></div>
    <div id="splashScreen" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50"></div>
    <div id="app-container" class="min-h-screen"></div>
    <!-- Scripts Externos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <!--
    ┌─────────────────────────────────────────────────────────────────────────┐
    │  ESTRUTURA DE MÓDULOS v6                                                 │
    │                                                                          │
    │  js/main.js              ← Entry point único (carrega tudo via import)  │
    │  js/api.js               ← Cliente HTTP da API                          │
    │  js/auth.js              ← Autenticação Firebase                        │
    │  js/firebase-config.js   ← Configuração Firebase principal              │
    │                                                                          │
    │  js/dashboard/           ← Módulos do Dashboard/Implementos             │
    │    tratos.js             ← Gráfico de profundidade + polling             │
    │    historico.js          ← Consulta histórica                           │
    │    regras.js             ← Regras de status e cálculos                  │
    │    Status.js             ← Cards de status                              │
    │    perfil.js             ← Perfil do usuário                            │
    │    ultimasleituras.js    ← Tabela de últimas leituras                   │
    │                                                                          │
    │  js/fertirrigacao/       ← Módulos de Fertirrigação                     │
    │    index.js              ← Orquestrador (entry da aba)                  │
    │    firebase.js           ← Firebase ESP32 (monitoramento-esp32-2551e)   │
    │    lagoas.js             ← Cards das lagoas + lógica de atualização     │
    │    chart.js              ← Gráfico de níveis (Chart.js)                 │
    │    subtabs.js            ← Navegação das sub-abas + autoplay            │
    │    vazao.js              ← Tabela de vazão + acumulados + meta          │
    │    input.js              ← Configuração das dimensões dos tanques       │
    │    regras.js             ← Cálculos: volume tronco de pirâmide         │
    │    analisetemporeal.js   ← Análise em tempo real                       │
    │    cards.js              ← Cards de resumo                             │
    │    metaaplic.js          ← Meta de aplicação                           │
    │    volume.js             ← Cálculo de volume                           │
    │    vazaolagoa.js         ← Vazão por lagoa                             │
    │                                                                          │
    │  js/equipamentos/        ← Módulos de Equipamentos                      │
    │    equipamentos.js       ← CRUD de equipamentos                        │
    │    equipe.js             ← Gerenciamento de equipes                    │
    │    grupo.js              ← Gerenciamento de grupos                     │
    │                                                                          │
    │  js/admin/               ← Módulos de Administração                     │
    │    users.js              ← Gerenciamento de usuários                   │
    └─────────────────────────────────────────────────────────────────────────┘
    -->

    <!-- Entry point único — todos os módulos carregados via ES import -->
    <script type="module" src="js/main.js?v=8.3.5"></script>

</body>
</html>
